<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Modelo Figurinha — Missão Paraná</title>
<meta name="hz:slide-selector" content=".slide">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#e9e9e9; }

  .slide {
    position:relative;
    width:1080px; height:1080px;
    overflow:hidden;
  }

  /* círculo de fundo */
  .circulo {
    position:absolute; inset:0;
    border-radius:50%;
  }
  .ouro  .circulo { background:#F1AF00; }
  .preto .circulo { background:#111111; border:12px solid #111111; box-shadow:inset 0 0 0 25px #F1AF00; }

  /* foto do candidato (trocar esta imagem) */
  .foto {
    position:absolute;
    left:50%; top:56px;
    width:840px;
    transform:translateX(-50%);
    object-fit:contain;
  }

  /* véu escuro que escurece a base */
  .veu {
    position:absolute; inset:0;
    border-radius:50%;
    background:linear-gradient(to bottom,
      rgba(0,0,0,0)   43%,
      rgba(0,0,0,.28) 62%,
      rgba(0,0,0,.62) 78%,
      rgba(0,0,0,.88) 93%,
      rgba(0,0,0,.94) 100%);
  }

  /* número */
  .numero {
    position:absolute; left:0; right:0; top:600px;
    font-family:'Anton',sans-serif;
    font-size:293px; line-height:1;
    text-align:center;
    letter-spacing:-2px;
  }
  .ouro  .numero { color:#EBA22C; }
  .preto .numero { color:#F6D98B; }

  /* cargo */
  .cargo {
    position:absolute; left:0; right:0; top:872px;
    font-family:'Anton',sans-serif;
    font-size:61px; line-height:1;
    text-align:center;
    letter-spacing:11px;
  }
  .ouro  .cargo { color:#FFFFFF; }
  .preto .cargo { color:#F1AF00; }

  /* linha legal obrigatória */
  .legal {
    position:absolute; left:0; right:0; top:942px;
    font-family:'Poppins',sans-serif; font-weight:500;
    font-size:23px; line-height:1;
    text-align:center;
    color:#FFFFFF;
    letter-spacing:.5px;
  }
</style>
</head>
<body>

<div class="slide ouro" data-document-role="page" data-label="Variante OURO">
  <div class="circulo"></div>
  <img class="foto" src="https://raw.githubusercontent.com/joaords98-ctrl/missaoparana/canva-template/foto-exemplo.png" alt="Foto do candidato">
  <div class="veu"></div>
  <div class="numero">14</div>
  <div class="cargo">GOVERNADOR</div>
  <div class="legal">PROPAGANDA ELEITORAL • CNPJ 68.594.408/0001-72</div>
</div>

<div class="slide preto" data-document-role="page" data-label="Variante PRETO">
  <div class="circulo"></div>
  <img class="foto" src="https://raw.githubusercontent.com/joaords98-ctrl/missaoparana/canva-template/foto-exemplo.png" alt="Foto do candidato">
  <div class="veu"></div>
  <div class="numero">14</div>
  <div class="cargo">GOVERNADOR</div>
  <div class="legal">PROPAGANDA ELEITORAL • CNPJ 68.594.408/0001-72</div>
</div>

</body>
</html>
